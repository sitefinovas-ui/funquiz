<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FUNQUIZ | Not found</title>
  <style>
    :root {
      --border-color: rgba(155, 52, 211, 0.3);
      --shadow-color: rgba(155, 52, 211, 0.4);
      --text-primary: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
    }

    .not-found-custom {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      background: linear-gradient(180deg, #110219 3%, #040108 100%);
    }

    .fs-custom-notFound {
      font-size: 400px;
      font-weight: 500;
      line-height: 1;
      margin-bottom: 1rem;
      background: linear-gradient(180deg, #9b34d3 3%, #040307 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .card-custom-notFound {
      text-align: center;
      background: #05010757;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid var(--border-color);
      box-shadow: 0px 0px 10px var(--shadow-color);
      padding: 1rem;
      border-radius: 10px;
      height: 200px;
      width: 33rem;
      position: absolute;
      bottom: 33%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
    }

    .card-text {
      margin-bottom: 1rem;
      font-size: 0.875rem;
      font-weight: 300;
    }

    .btn-custom-notFound {
      margin-top: 0.75rem;
      background: linear-gradient(80deg, #a430c5a5 5%, #5f4706 100%);
      border: none;
      border-radius: 9999px;
      color: var(--text-primary);
      cursor: pointer;
      padding: 10px 20px;
      font-size: 1rem;
      transition:
        background 0.6s ease-in-out,
        transform 0.6s ease-in-out;
    }

    .btn-custom-notFound:hover {
      background: linear-gradient(130deg, #a430c5a5 5%, #5f1306 100%);
      transform: scale(1.1);
      animation: btn-custom-notFound 0.6s infinite ease-in-out;
    }

    @keyframes btn-custom-notFound {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    @media (max-width: 576px) {
      .fs-custom-notFound {
        font-size: 200px;
      }
      .card-custom-notFound {
        width: 20rem;
      }
    }
  </style>
</head>
<body>
  <div class="not-found-custom">
    <h1 class="fs-custom-notFound">404</h1>
    <div class="card-custom-notFound">
      <p class="card-title">Page not found</p>
      <p class="card-text">Désolé, la page que vous recherchez n'existe pas.</p>
      <a href="/" class="btn-custom-notFound">Retourner à l'accueil</a>
    </div>
  </div>
</body>
</html>
